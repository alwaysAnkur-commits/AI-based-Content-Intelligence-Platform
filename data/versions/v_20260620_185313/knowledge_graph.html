        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 800px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             
             #config {
                 float: left;
                 width: 400px;
                 height: 600px;
             }
             

             
        </style>

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#CCCCCC", "id": "An uncrewed vessel", "label": "An uncrewed vessel", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "two crew members", "label": "two crew members", "shape": "dot", "title": "default"}, {"color": "#FF6B6B", "id": "Karim Khan", "label": "Karim Khan", "shape": "dot", "title": "PERSON"}, {"color": "#CCCCCC", "id": "all allegations", "label": "all allegations", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "The Pentagon list", "label": "The Pentagon list", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "US firms", "label": "US firms", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "The crew", "label": "The crew", "shape": "dot", "title": "default"}, {"color": "#FFD93D", "id": "Oman", "label": "Oman", "shape": "dot", "title": "GPE"}, {"color": "#CCCCCC", "id": "US officials", "label": "US officials", "shape": "dot", "title": "default"}, {"color": "#4ECDC4", "id": "CBS News", "label": "CBS News", "shape": "dot", "title": "ORG"}, {"color": "#CCCCCC", "id": "he", "label": "he", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "an 11-hour immigration interview", "label": "an 11-hour immigration interview", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the decision", "label": "the decision", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "that", "label": "that", "shape": "dot", "title": "default"}, {"color": "#A8DADC", "id": "Monday", "label": "Monday", "shape": "dot", "title": "DATE"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "An uncrewed vessel", "label": "other", "to": "two crew members", "value": 2}, {"arrows": "to", "from": "Karim Khan", "label": "other", "to": "all allegations", "value": 2}, {"arrows": "to", "from": "The Pentagon list", "label": "other", "to": "US firms", "value": 2}, {"arrows": "to", "from": "The crew", "label": "other", "to": "Oman", "value": 3}, {"arrows": "to", "from": "US officials", "label": "other", "to": "CBS News", "value": 2}, {"arrows": "to", "from": "he", "label": "other", "to": "an 11-hour immigration interview", "value": 2}, {"arrows": "to", "from": "he", "label": "other", "to": "the decision", "value": 2}, {"arrows": "to", "from": "that", "label": "other", "to": "Monday", "value": 2}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
