    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#CCCCCC", "id": "Forwarder", "label": "Forwarder", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "Wednesday evening", "label": "Wednesday evening", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the Channel", "label": "the Channel", "shape": "dot", "title": "default"}, {"color": "#FF6B6B", "id": "JD Vance", "label": "JD Vance", "shape": "dot", "title": "PERSON"}, {"color": "#FFD93D", "id": "Switzerland", "label": "Switzerland", "shape": "dot", "title": "GPE"}, {"color": "#CCCCCC", "id": "Morocco captain Achraf Hakimi", "label": "Morocco captain Achraf Hakimi", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "accusations", "label": "accusations", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "trial", "label": "trial", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "The BBC", "label": "The BBC", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "Sydney locals", "label": "Sydney locals", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "Three Iranian tankers", "label": "Three Iranian tankers", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the Gulf", "label": "the Gulf", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the US blockade line", "label": "the US blockade line", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "it", "label": "it", "shape": "dot", "title": "default"}, {"color": "#4ECDC4", "id": "Hezbollah", "label": "Hezbollah", "shape": "dot", "title": "ORG"}, {"color": "#CCCCCC", "id": "the US", "label": "the US", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "a deal", "label": "a deal", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the claims", "label": "the claims", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "a victory", "label": "a victory", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "they", "label": "they", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "the newly announced, longest ever commercial flight", "label": "the newly announced, longest ever commercial flight", "shape": "dot", "title": "default"}, {"color": "#CCCCCC", "id": "which", "label": "which", "shape": "dot", "title": "default"}, {"color": "#FFD93D", "id": "Primorsk", "label": "Primorsk", "shape": "dot", "title": "GPE"}, {"color": "#CCCCCC", "id": "port", "label": "port", "shape": "dot", "title": "default"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "Forwarder", "label": "other", "to": "Wednesday evening", "value": 2}, {"arrows": "to", "from": "Forwarder", "label": "other", "to": "the Channel", "value": 2}, {"arrows": "to", "from": "JD Vance", "label": "other", "to": "Switzerland", "value": 2}, {"arrows": "to", "from": "Morocco captain Achraf Hakimi", "label": "other", "to": "accusations", "value": 2}, {"arrows": "to", "from": "Morocco captain Achraf Hakimi", "label": "other", "to": "trial", "value": 2}, {"arrows": "to", "from": "The BBC", "label": "other", "to": "Sydney locals", "value": 2}, {"arrows": "to", "from": "Three Iranian tankers", "label": "other", "to": "the Gulf", "value": 2}, {"arrows": "to", "from": "Three Iranian tankers", "label": "other", "to": "the US blockade line", "value": 2}, {"arrows": "to", "from": "it", "label": "other", "to": "Hezbollah", "value": 2}, {"arrows": "to", "from": "the US", "label": "other", "to": "a deal", "value": 2}, {"arrows": "to", "from": "the claims", "label": "other", "to": "a victory", "value": 2}, {"arrows": "to", "from": "they", "label": "other", "to": "the newly announced, longest ever commercial flight", "value": 2}, {"arrows": "to", "from": "which", "label": "other", "to": "Primorsk", "value": 2}, {"arrows": "to", "from": "which", "label": "other", "to": "port", "value": 2}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
